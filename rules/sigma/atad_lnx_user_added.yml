title: New Local User Created
id: 8c3e2f1a-5d6b-4a7c-9e0f-1a2b3c4d5e61
status: experimental
description: A new local account was created with useradd. Expected during administration; worth checking during an incident because attackers add accounts to keep access.
references:
    - https://attack.mitre.org/techniques/T1136/001/
author: ATAD Team (Hoor Fawaz, Danah Fawaz)
date: 2026-11-08
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    product: linux
    service: auth
detection:
    keywords:
        - 'new user: name='
    condition: keywords
falsepositives:
    - Normal account administration
level: low

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atad"
version = "0.1.0"
description = "ATAD (عَتاد) — Advanced Toolkit for Attack & Defense"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Danah Fawaz" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atad = "atad.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atad = ["cases/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

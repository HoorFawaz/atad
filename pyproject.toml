[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atad"
version = "0.1.0"
description = "ATAD (عَتاد) — Advanced Toolkit for Attack & Defense"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hoor Fawaz" },
    { name = "Danah Fawaz" },
]
license = "LicenseRef-ATAD-SAL-1.0"
license-files = ["LICENSE", "LICENSE.ar"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "evtx>=0.8",
    "jinja2>=3.1",
]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
slow-evtx = ["python-evtx>=0.8"]
dev = ["pytest>=8", "ruff==0.16.9"]

[project.scripts]
atad = "atad.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atad = ["cases/schema.sql", "reports/templates/*.j2", "demo/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["tests/fixtures/sigmahq"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "C4", "BLE", "DTZ", "PIE", "RUF", "ISC", "FLY", "PLC", "S110"]
# B008: Typer declares options as function defaults (typer.Option(...)) by design.
# PLC0415: optional or platform-only libraries (yara, winreg, zoneinfo) are imported late on purpose.
# UP042: StrEnum would change how enum values print; the (str, Enum) form is kept.
ignore = ["B008", "PLC0415", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Test samples are written to look like the real log lines, one item per line.
"tests/fixtures/*" = ["FLY002"]


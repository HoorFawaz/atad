name: release

# Push a tag such as v0.2.0 to build atad.exe on Windows and publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,yara]" pyinstaller
      - name: Tests must pass before release
        run: python -m pytest
      - name: Build atad.exe
        run: python packaging/build.py
      - name: Smoke test the executable
        shell: pwsh
        run: |
          .\dist\atad.exe --version
          .\dist\atad.exe doctor; if ($LASTEXITCODE -gt 1) { exit 1 }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            (Get-ChildItem dist\atad-*.zip).FullName dist\SHA256SUMS.txt `
            --title "atad ${{ github.ref_name }}" --notes-file CHANGELOG.md
